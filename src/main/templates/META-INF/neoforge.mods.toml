modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mixins]]
    config="thaumichorizons.mixins.json"

[[mixins]]
    config="thaumichorizons-client.mixins.json"

[[mixins]]
    config="thaumichorizons-tc.mixins.json"

[[mixins]]
    config="thaumichorizons-tc-client.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
description='''
An unofficial port of Thaumic Horizons for Thaumcraft 4: Reforged.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="thaumcraft"
    type="required"
    versionRange="[${tc4r_version},)"
    ordering="AFTER"
    side="BOTH"

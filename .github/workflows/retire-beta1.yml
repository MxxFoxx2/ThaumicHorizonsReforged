name: Retire legacy beta.1 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retire:
    if: "${{ startsWith(github.event.head_commit.message, 'maintenance: retire beta.1 release') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the cleanup commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Delete the old beta.1 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-beta.1"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            git push origin ":refs/tags/$tag"
          fi

      - name: Remove this one-off cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/retire-beta1.yml"
          blob_sha="$(git rev-parse "HEAD:$path")"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="chore: remove one-off beta.1 cleanup workflow" \
            -f sha="$blob_sha" \
            -f branch="main"

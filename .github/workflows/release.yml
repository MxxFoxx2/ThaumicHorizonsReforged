name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: "true"

    steps:
      - name: Checkout tagged Thaumic Horizons revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: thaumic-horizons-reforged

      # This is the source revision corresponding to the currently published
      # upstream TC4R 1.1.3 (release tag 26.3). Do not replace it with the fork:
      # production releases must be compatible with the dependency users can install.
      - name: Checkout published TC4 Reforged source
        uses: actions/checkout@v7
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: 99499a8ef6cf9af0efa6a93a058ea56a42a0e7b2
          path: thaumcraft-4-reforged
          persist-credentials: false

      - name: Validate release tag and main ancestry
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)."
            exit 1
          fi

          tag_version="${tag#v}"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          if [[ "$tag_version" != "$mod_version" ]]; then
            echo "::error::Tag version ($tag_version) does not match mod_version ($mod_version) in gradle.properties."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release tag must point to a commit reachable from main."
            exit 1
          fi

      # Guard against publishing a mod that compiles only against the development
      # fork but cannot work with the published TC4R dependency in the README.
      - name: Verify required APIs exist in published TC4 Reforged
        working-directory: thaumcraft-4-reforged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          checks = {
              "custom WandItem subclasses are recognised": (
                  Path("src/main/java/thaumcraft/wand/Wands.java"),
                  "stack.getItem() instanceof WandItem",
              ),
              "Creature Infusion research pages are supported": (
                  Path("src/main/java/thaumcraft/research/ResearchPage.java"),
                  "creatureInfusion",
              ),
              "Synthetic node type is available": (
                  Path("src/main/java/thaumcraft/node/NodeType.java"),
                  "SYNTHETIC",
              ),
              "Ethereal node type is available": (
                  Path("src/main/java/thaumcraft/node/NodeType.java"),
                  "ETHEREAL",
              ),
          }

          missing = []
          for description, (path, token) in checks.items():
              if not path.is_file() or token not in path.read_text(encoding="utf-8"):
                  missing.append(description)

          if missing:
              print("::error::The published TC4 Reforged source does not yet contain the API required by this addon.")
              for item in missing:
                  print(f" - {item}")
              print("No release was created. Update the published TC4R dependency/API first; do not bypass this gate by building against the development fork.")
              sys.exit(1)

          print("Published TC4 Reforged API compatibility checks passed.")
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check platform/API seams
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_seams.py

      - name: Build release JAR
        working-directory: thaumic-horizons-reforged
        run: chmod +x ./gradlew && ./gradlew build --configuration-cache --build-cache --parallel --console=plain

      - name: Verify and checksum release JAR
        id: package
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          expected="build/libs/thaumic-horizons-reforged-${mod_version}-${minecraft_version}.jar"

          test -s "$expected" || {
            echo "::error::Expected distributable not found: $expected"
            find build/libs -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          }

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print | sort)
          test "${#jars[@]}" -eq 1 || {
            echo "::error::Expected exactly one JAR in build/libs; found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          }
          test "${jars[0]}" = "$expected"

          jar tf "$expected" > "$RUNNER_TEMP/jar-contents.txt"
          for required in META-INF/neoforge.mods.toml thaumichorizons.mixins.json; do
            grep -Fxq "$required" "$RUNNER_TEMP/jar-contents.txt" || {
              echo "::error::Required mod resource missing from JAR: $required"
              exit 1
            }
          done

          if grep -Eq '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"; then
            echo "::error::Development-only files or sources leaked into the release JAR."
            grep -E '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"
            exit 1
          fi

          sha256sum "$expected" > "${expected}.sha256"
          echo "jar=$expected" >> "$GITHUB_OUTPUT"
          echo "checksum=${expected}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        working-directory: thaumic-horizons-reforged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="Thaumic Horizons: Reforged ${tag#v}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.package.outputs.jar }}" "${{ steps.package.outputs.checksum }}" --clobber
          else
            args=(--title "$title" --generate-notes)
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "${{ steps.package.outputs.jar }}" "${{ steps.package.outputs.checksum }}" "${args[@]}"
          fi

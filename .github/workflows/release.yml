name: Release

on:
  workflow_dispatch:
    inputs:
      publish_early_release:
        description: "Confirm publishing this documented pre-1.0 release while some gameplay checks remain open."
        required: true
        type: boolean
        default: false
      fixed_issues:
        description: "Comma-separated issue numbers fixed in this release; leave empty when there are none."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish Minecraft 26.3 release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_early_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: read
    env:
      CI: "true"

    steps:
      - name: Checkout Thaumic Horizons
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: thaumic-horizons-reforged

      - name: Checkout pinned official Thaumcraft 4 Reforged
        uses: actions/checkout@v7
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: 99499a8ef6cf9af0efa6a93a058ea56a42a0e7b2
          path: thaumcraft-4-reforged
          persist-credentials: false

      - name: Verify the pinned TC4R host revision
        working-directory: thaumcraft-4-reforged
        shell: bash
        run: |
          set -euo pipefail
          expected="99499a8ef6cf9af0efa6a93a058ea56a42a0e7b2"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error::Expected TC4R $expected, got $actual"
            exit 1
          }

      - name: Validate branch, version and release tag
        working-directory: thaumic-horizons-reforged
        env:
          EXPECTED_BRANCH: main
          EXPECTED_MINECRAFT_VERSION: "26.3"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$EXPECTED_BRANCH" ]]; then
            echo "::error::Run this workflow from $EXPECTED_BRANCH."
            exit 1
          fi
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          [[ "$minecraft_version" == "$EXPECTED_MINECRAFT_VERSION" ]] || {
            echo "::error::Expected Minecraft $EXPECTED_MINECRAFT_VERSION, got $minecraft_version"
            exit 1
          }
          [[ "$mod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release version must be a plain MAJOR.MINOR.PATCH without beta/RC suffix."
            exit 1
          }
          tag="v${mod_version}+mc${minecraft_version}"
          if [[ -n "$(git ls-remote --refs origin "refs/tags/$tag")" ]]; then
            echo "::error::Release tag already exists: $tag"
            exit 1
          fi
          git fetch --no-tags origin "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Workflow commit is not on $EXPECTED_BRANCH."
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"
          echo "MINECRAFT_VERSION=$minecraft_version" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check platform/API seams
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_seams.py

      - name: Check model, texture and research-page assets
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_assets.py

      - name: Build and run JUnit tests
        working-directory: thaumic-horizons-reforged
        run: chmod +x ./gradlew && ./gradlew build --configuration-cache --build-cache --parallel --console=plain

      - name: Verify and checksum distributable
        id: package
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail
          expected="build/libs/thaumic-horizons-reforged-${MOD_VERSION}-${MINECRAFT_VERSION}.jar"
          test -s "$expected" || {
            echo "::error::Expected JAR not found: $expected"
            find build/libs -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          }
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print | sort)
          test "${#jars[@]}" -eq 1 && test "${jars[0]}" = "$expected" || {
            echo "::error::Expected exactly one distributable JAR."
            printf '%s\n' "${jars[@]}"
            exit 1
          }
          jar tf "$expected" > "$RUNNER_TEMP/jar-contents.txt"
          for required in META-INF/neoforge.mods.toml thaumichorizons.mixins.json; do
            grep -Fxq "$required" "$RUNNER_TEMP/jar-contents.txt" || {
              echo "::error::Required JAR entry missing: $required"
              exit 1
            }
          done
          if grep -Eq '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"; then
            echo "::error::Development-only files leaked into the JAR."
            exit 1
          fi
          sha256sum "$expected" > "${expected}.sha256"
          echo "jar=$expected" >> "$GITHUB_OUTPUT"
          echo "checksum=${expected}.sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        working-directory: thaumic-horizons-reforged
        shell: bash
        env:
          FIXED_ISSUES: ${{ inputs.fixed_issues }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixes_section=""
          if [[ -n "${FIXED_ISSUES//[[:space:],]/}" ]]; then
            IFS=',' read -r -a requested_issues <<< "$FIXED_ISSUES"
            declare -A seen_issues=()
            fixes_section=$'\n## Fixes\n\n'
            for raw_number in "${requested_issues[@]}"; do
              issue_number="$(printf '%s' "$raw_number" | xargs)"
              [[ "$issue_number" =~ ^[1-9][0-9]*$ ]] || {
                echo "::error::Invalid issue number: $raw_number. Use comma-separated numbers without #."
                exit 1
              }
              [[ -z "${seen_issues[$issue_number]:-}" ]] || {
                echo "::error::Duplicate issue number: $issue_number"
                exit 1
              }
              seen_issues[$issue_number]=1

              issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")"
              issue_state="$(jq -r '.state // empty' <<< "$issue_json")"
              state_reason="$(jq -r '.state_reason // empty' <<< "$issue_json")"
              is_pull_request="$(jq -r 'has("pull_request")' <<< "$issue_json")"
              [[ "$is_pull_request" == "false" ]] || {
                echo "::error::#$issue_number is a pull request, not an issue."
                exit 1
              }
              [[ "$issue_state" == "closed" && "$state_reason" == "completed" ]] || {
                echo "::error::#$issue_number must be closed as completed before it can appear under Fixes."
                exit 1
              }
              issue_title="$(jq -r '.title | gsub("[\\r\\n]"; " ")' <<< "$issue_json")"
              issue_url="$(jq -r '.html_url' <<< "$issue_json")"
              fixes_section+="- [#${issue_number}](${issue_url}) — ${issue_title}"$'\n'
            done
            fixes_section+=$'\n'
          fi

          if [[ "$MOD_VERSION" == "0.1.0" ]]; then
            release_intro="This is the initial **0.x public release** for this Minecraft version line."
          else
            release_intro="This is an update in the **0.x pre-1.0 release line** for this Minecraft version."
          fi
          if [[ "$MOD_VERSION" == "1.0.0" ]]; then
            versioning_note="This is the 1.0.0 stability milestone."
          else
            versioning_note="<code>${MOD_VERSION}</code> is intentionally pre-1.0 and does not claim the compatibility guarantees of <code>1.0.0</code>."
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Thaumic Horizons: Reforged ${MOD_VERSION} — Minecraft ${MINECRAFT_VERSION}

          ${release_intro} It is published as a regular GitHub release (not a beta/prerelease).

          ## Host compatibility

          Targets the official [Thaumcraft 4: Reforged 1.1.3 release for Minecraft 26.3](https://github.com/notlikethiss/thaumcraft-4-reforged/releases/tag/26.3), pinned to commit <code>99499a8ef6cf9af0efa6a93a058ea56a42a0e7b2</code>. No custom TC4R fork is required.

          On the official host, automatic multi-transducer-to-Vortex conversion in the Transduction Amplifier remains disabled because the public host API has no safe transducer-stop hook. Optional machine-beam FX and Creature Infusion research-page extensions are unavailable; active TH content does not currently depend on them.

          ${fixes_section}
          ## Validation

          This workflow reruns the build, JUnit suite, API-seam checks, asset checks and distributable-JAR validation. See [docs/verification.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/verification.md) for the tested scope.

          This release does not claim exhaustive gameplay parity. Multiplayer, persistence and several end-to-end workflows remain under verification; Pocket Plane travel and recovery are especially not yet validated as a complete playable loop. Back up worlds before testing.

          ## Versioning

          ${versioning_note}
          EOF

      - name: Publish non-prerelease GitHub Release
        working-directory: thaumic-horizons-reforged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="Thaumic Horizons: Reforged $MOD_VERSION — Minecraft $MINECRAFT_VERSION"
          gh release create "$tag" "${{ steps.package.outputs.jar }}" "${{ steps.package.outputs.checksum }}" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false

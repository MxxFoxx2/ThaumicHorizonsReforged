name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    if: (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: "true"

    steps:
      - name: Checkout tagged Thaumic Horizons revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: thaumic-horizons-reforged

      # TEMPORARY: build this release line against our own TC4R add-on API fork.
      # Keep the pin aligned with the snapshot used by the main CI workflow.
      - name: Checkout custom TC4 Reforged add-on API
        uses: actions/checkout@v7
        with:
          repository: MxxFoxx2/thaumcraft-4-reforged
          ref: c5b7a0d99c2c23f097591c1343b8f6d3d3d8febb
          path: thaumcraft-4-reforged
          persist-credentials: false

      - name: Verify the pinned custom TC4R revision
        working-directory: thaumcraft-4-reforged
        shell: bash
        run: |
          set -euo pipefail
          expected="c5b7a0d99c2c23f097591c1343b8f6d3d3d8febb"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Release host dependency is not the CI-tested custom TC4R revision."
            exit 1
          fi

      - name: Validate release tag and main ancestry
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(grep "^mod_version=" gradle.properties | cut -d= -f2)"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="v$mod_version"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)."
            exit 1
          fi

          tag_version="${tag#v}"
          if [[ "$tag_version" != "$mod_version" ]]; then
            echo "::error::Release tag ($tag_version) does not match mod_version ($mod_version) in gradle.properties."
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "$GITHUB_REF" == refs/tags/* ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release tag must point to a commit reachable from main."
            exit 1
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check platform/API seams
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_seams.py

      - name: Build release JAR
        working-directory: thaumic-horizons-reforged
        run: chmod +x ./gradlew && ./gradlew build --configuration-cache --build-cache --parallel --console=plain

      - name: Verify and checksum release JAR
        id: package
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          expected="build/libs/thaumic-horizons-reforged-${mod_version}-${minecraft_version}.jar"

          test -s "$expected" || {
            echo "::error::Expected distributable not found: $expected"
            find build/libs -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          }

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print | sort)
          test "${#jars[@]}" -eq 1 || {
            echo "::error::Expected exactly one JAR in build/libs; found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          }
          test "${jars[0]}" = "$expected"

          jar tf "$expected" > "$RUNNER_TEMP/jar-contents.txt"
          for required in META-INF/neoforge.mods.toml thaumichorizons.mixins.json; do
            grep -Fxq "$required" "$RUNNER_TEMP/jar-contents.txt" || {
              echo "::error::Required mod resource missing from JAR: $required"
              exit 1
            }
          done

          if grep -Eq '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"; then
            echo "::error::Development-only files or sources leaked into the release JAR."
            grep -E '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"
            exit 1
          fi

          sha256sum "$expected" > "${expected}.sha256"
          echo "jar=$expected" >> "$GITHUB_OUTPUT"
          echo "checksum=${expected}.sha256" >> "$GITHUB_OUTPUT"

      - name: Prepare release description
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Thaumic Horizons: Reforged ${tag#v}

          This build packages the current source implementation of the major Thaumic Horizons content systems for Minecraft 26.3 / NeoForge 26.3.

          ## Temporary TC4 Reforged dependency warning

          **This release requires the custom TC4R add-on API build from [MxxFoxx2/thaumcraft-4-reforged](https://github.com/MxxFoxx2/thaumcraft-4-reforged), branch feat/addon-api, using CI-tested commit c5b7a0d99c2c23f097591c1343b8f6d3d3d8febb ([view exact commit](https://github.com/MxxFoxx2/thaumcraft-4-reforged/commit/c5b7a0d99c2c23f097591c1343b8f6d3d3d8febb)).**

          The ordinary published notlikethiss/thaumcraft-4-reforged 1.1.3 release does not yet include every add-on hook consumed by this build and is not a compatible substitute. Build and install the matching custom TC4R JAR using the instructions in the repository README.

          This requirement is temporary. The warning will be removed after the required APIs are included in the published TC4R artifact and the release build is checked against it.

          ## Pre-release testing status

          The major content implementations are present in the source, but many end-to-end gameplay and client-acceptance checks remain open. In particular, Pocket Plane terrain, portals, travel and recovery; several Vat, Soul Jar and syringe workflows; multiplayer and save/reload behavior; and visual parity still need in-game testing. Back up worlds before testing.

          A green CI run confirms the configured seam, build and JAR checks; it does not certify all gameplay scenarios.
          EOF

      - name: Create GitHub Release
        working-directory: thaumic-horizons-reforged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          title="Thaumic Horizons: Reforged ${tag#v}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.package.outputs.jar }}" "${{ steps.package.outputs.checksum }}" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            args=(--title "$title" --notes-file "$RUNNER_TEMP/release-notes.md")
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "${{ steps.package.outputs.jar }}" "${{ steps.package.outputs.checksum }}" --target "$GITHUB_SHA" "${args[@]}"
          fi

name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"

    steps:
      - name: Checkout Thaumic Horizons
        uses: actions/checkout@v7
        with:
          path: thaumic-horizons-reforged

      # Build against the public Minecraft 1.21.1 / TC4R mc/1.21.1 branch.
      # Pin the resolved branch commit so CI never follows a moving branch.
      - name: Checkout official Thaumcraft 4 Reforged
        uses: actions/checkout@v7
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: mc/1.21.1
          path: thaumcraft-4-reforged
          persist-credentials: false

      - name: Verify official TC4R mc/1.21.1 revision
        run: |
          checked=$(git -C thaumcraft-4-reforged rev-parse HEAD)
          echo "Checked out official TC4R revision: $checked"
          if [ "$checked" != "03f354ac4ed91151ef10c9d9b2e4947789453472" ]; then
            echo "::error::TC4R mc/1.21.1 revision mismatch: expected 03f354ac4ed91151ef10c9d9b2e4947789453472, got $checked" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          # Set this repository secret to persist the encrypted Configuration Cache
          # between GitHub-hosted runners. Dependency/build caches work without it.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check platform/API seams
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_seams.py

      - name: Check model, texture and research-page assets
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_assets.py

      - name: Check data pack formats
        working-directory: thaumic-horizons-reforged
        run: python3 -I tools/check_data.py

      - name: Build with Gradle
        working-directory: thaumic-horizons-reforged
        run: chmod +x ./gradlew && ./gradlew build -Ptc4rPath=../thaumcraft-4-reforged --configuration-cache --build-cache --parallel --console=plain

      - name: Smoke test dedicated server
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          log_path = Path(os.environ["RUNNER_TEMP"]) / "thr-server-smoke.log"
          command = [
              "./gradlew", "runServer",
              "-Ptc4rPath=../thaumcraft-4-reforged",
              "--no-daemon", "--console=plain",
          ]
          with log_path.open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  command,
                  stdin=subprocess.PIPE,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              deadline = time.monotonic() + 180
              reached_done = False
              try:
                  while time.monotonic() < deadline and process.poll() is None:
                      if "Done (" in log_path.read_text(encoding="utf-8", errors="replace"):
                          reached_done = True
                          process.stdin.write("stop\n")
                          process.stdin.flush()
                          break
                      time.sleep(1)
                  if process.poll() is None:
                      try:
                          process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.wait()

          output = log_path.read_text(encoding="utf-8", errors="replace")
          print(output)
          if not reached_done:
              print("Dedicated server did not reach Done", file=sys.stderr)
              sys.exit(1)
          if "Thaumic Horizons: Reforged loaded" not in output:
              print("THR was not loaded by the dedicated server", file=sys.stderr)
              sys.exit(1)
          if process.returncode != 0:
              sys.exit(process.returncode)
          PY

      - name: Verify distributable JAR contents
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          expected="build/libs/thaumic-horizons-reforged-${mod_version}-${minecraft_version}.jar"

          test -s "$expected" || {
            echo "::error::Expected distributable not found: $expected"
            find build/libs -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          }

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print | sort)
          test "${#jars[@]}" -eq 1 || {
            echo "::error::Expected exactly one JAR in build/libs; found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          }
          test "${jars[0]}" = "$expected"

          jar tf "$expected" > "$RUNNER_TEMP/jar-contents.txt"

          for required in META-INF/neoforge.mods.toml thaumichorizons.mixins.json; do
            grep -Fxq "$required" "$RUNNER_TEMP/jar-contents.txt" || {
              echo "::error::Required mod resource missing from JAR: $required"
              exit 1
            }
          done

          if grep -Eq '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"; then
            echo "::error::Development-only files or sources leaked into the distributable:"
            grep -E '(^|/)(reference|docs|tools|run|runs|logs|\.git|\.gradle|\.github)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|README[^/]*|LICENSE[^/]*)$|\.(java|log|psd|xcf)$' "$RUNNER_TEMP/jar-contents.txt"
            exit 1
          fi

          echo "Verified distributable: $expected"
          du -h "$expected"

      - name: Create distributable checksum
        working-directory: thaumic-horizons-reforged
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          jar="build/libs/thaumic-horizons-reforged-${mod_version}-${minecraft_version}.jar"
          sha256sum "$jar" > "${jar}.sha256"

      - name: Upload distributable
        uses: actions/upload-artifact@v7
        with:
          name: thaumic-horizons-reforged-${{ github.sha }}
          path: |
            thaumic-horizons-reforged/build/libs/*.jar
            thaumic-horizons-reforged/build/libs/*.jar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
